[package]
name = "papillon"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Sticky notes floating on your desktop"
repository = "https://github.com/Shhu/papillon"
build = "build.rs"

[dependencies]
eframe = "0.36.2"
egui-phosphor = "0.14"
fluent-bundle = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(not(windows))'.dependencies]
x11-dl = "2"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
fluent-syntax = "0.12"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
