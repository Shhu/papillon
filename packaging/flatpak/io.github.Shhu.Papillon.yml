# Flatpak of Papillon, built from the working tree, from source and without
# network access: the Rust crates come from cargo-sources.json (made by
# flatpak-cargo-generator from Cargo.lock, see build.sh).
app-id: io.github.Shhu.Papillon
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: papillon
finish-args:
  - --share=ipc
  # X11 and not Wayland: notes must come back where they were left and may
  # stay on top, which Wayland doesn't let an app ask for.
  - --socket=x11
  - --device=dri
modules:
  - name: papillon
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/papillon/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --locked --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked --verbose
      - install -Dm755 target/release/papillon /app/bin/papillon
      - install -Dm644 packaging/flatpak/io.github.Shhu.Papillon.desktop /app/share/applications/io.github.Shhu.Papillon.desktop
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.Shhu.Papillon.svg
      - install -Dm644 packaging/flatpak/io.github.Shhu.Papillon.metainfo.xml /app/share/metainfo/io.github.Shhu.Papillon.metainfo.xml
      - install -Dm644 -t /app/share/licenses/io.github.Shhu.Papillon LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md assets/licenses.txt assets/fonts/Inter-OFL.txt
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - docs
          - packaging/flatpak/build
          - packaging/flatpak/repo
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/papillon.flatpak
      - cargo-sources.json
